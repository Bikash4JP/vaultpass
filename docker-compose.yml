# VaultPass — local development environment
#
# Usage:
#   Infrastructure only (works now, M0):
#     docker compose up -d
#
#   Full stack (requires app code from M1+):
#     docker compose --profile app up -d
#
# First-time setup:
#   cp .env.example .env   # then fill in secrets

services:

  # ─── Infrastructure ─────────────────────────────────────────────────────────

  postgres:
    image: postgres:16-alpine
    container_name: vaultpass-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-vaultpass}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      POSTGRES_DB: ${POSTGRES_DB:-vaultpass_dev}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-vaultpass} -d ${POSTGRES_DB:-vaultpass_dev}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ─── Application — available after M1 scaffolding (--profile app) ───────────

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
      target: dev
    container_name: vaultpass-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: development
      PORT: ${API_PORT:-3000}
      DATABASE_URL: postgresql://${POSTGRES_USER:-vaultpass}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-vaultpass_dev}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set in .env}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?JWT_REFRESH_SECRET must be set in .env}
      ARGON2_PEPPER: ${ARGON2_PEPPER:?ARGON2_PEPPER must be set in .env}
    ports:
      - "${API_PORT:-3000}:3000"
    volumes:
      - ./apps/api:/app
      - api_modules:/app/node_modules
    profiles:
      - app

  web:
    build:
      context: ./packages/web
      dockerfile: Dockerfile
      target: dev
    container_name: vaultpass-web
    restart: unless-stopped
    depends_on:
      - api
    environment:
      NODE_ENV: development
      VITE_API_URL: http://localhost:${API_PORT:-3000}
    ports:
      - "${WEB_PORT:-5173}:5173"
    volumes:
      - ./packages/web:/app
      - web_modules:/app/node_modules
    profiles:
      - app

volumes:
  postgres_data:
    driver: local
  api_modules:
    driver: local
  web_modules:
    driver: local
